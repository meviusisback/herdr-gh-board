  <text x="134" y="91" fill="#8b95a5" font-family="JetBrains Mono" font-size="11">Fix login redirect</text>
  <text x="384" y="91" fill="#596170" font-family="JetBrains Mono" font-size="10" text-anchor="end">feat/login</text>
